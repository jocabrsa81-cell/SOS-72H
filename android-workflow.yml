# Gera o APK Android (debug) com Capacitor. Fica em Actions → execução → Artifacts.
name: Gerar APK Android
on:
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Montar a app
        run: node build.mjs
      - name: Instalar dependências
        run: npm install
      - name: Criar projeto Android
        run: npx cap add android
      - name: Permissões (câmara para a lanterna, GPS, notificações)
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.VIBRATE" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n    <uses-feature android:name="android.hardware.camera.flash" android:required="false" />\n    <uses-feature android:name="android.hardware.location.gps" android:required="false" />\n\n    <application#' $M
      - name: Ícones
        run: |
          mkdir -p assets && cp icon-only.png icon-foreground.png icon-background.png assets/
          npx capacitor-assets generate --android
        continue-on-error: true
      - name: Sincronizar
        run: npx cap sync android
      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: SOS72H-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
